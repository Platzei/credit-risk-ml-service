[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-risk-ml-service"
version = "0.1.0"
description = "A portfolio ML engineering project for credit risk prediction."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "catboost",
    "pandas",
    "scikit-learn",
]

[project.optional-dependencies]
dev = [
    "jupyter",
    "matplotlib",
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
